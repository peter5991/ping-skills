<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIT 课件播放器</title>
<style>
  :root { --bg:#0B0D10; --panel:#14181D; --hairline:#2A3038; --ink:#E8E8E8; --muted:#9AA3AD; --good:#83C167; --accent:#5FB4CC; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif; overflow:hidden; }
  #stage { height:100%; display:flex; align-items:center; justify-content:center; }
  #stage video, #stage img { max-width:100%; max-height:100%; }
  #stage .text { max-width:1100px; padding:40px; }
  #stage .text h1 { font-size:54px; margin:0 0 24px; }
  #stage .text p { font-size:32px; line-height:1.6; color:var(--muted); }
  #stage .pending { font-size:40px; color:var(--muted); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #hud { position:fixed; right:16px; bottom:12px; display:flex; gap:14px; align-items:baseline;
    font-size:15px; color:var(--muted); user-select:none; }
  #hud .pos { font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums; }
  #hud .st-clip { color:var(--good); } #hud .st-frame { color:var(--accent); }
  #notes { position:fixed; left:16px; bottom:12px; max-width:60%; font-size:16px; color:var(--muted);
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px; padding:10px 14px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage"><div class="pending">等待课件…</div></div>
<div id="hud"><span class="pos" id="pos">–/–</span><span id="state"></span><span id="queue"></span></div>
<div id="notes" hidden></div>
<script>
// JIT 课件播放器:页陆续到达,按"当前有什么放什么"渲染,资产升级时热替换。
// 协议见 references/jit.md:manifest.json 轮询(no-store),页状态 pending|text|frame|clip。
// 键位:→ 下一页 / ← 上一页 / 空格 暂停·继续语音 / N 演讲者备注
const POLL_MS = 1000;
const STAGE = document.getElementById("stage"), POS = document.getElementById("pos"),
      STATE = document.getElementById("state"), QUEUE = document.getElementById("queue"),
      NOTES = document.getElementById("notes");
const STATE_LABEL = { pending: "制作中", text: "文字稿", frame: "静帧", clip: "动画" };
let manifest = null, idx = 0, shownKey = "", audio = null, audioPage = null;

async function poll() {
  try {
    const r = await fetch("manifest.json", { cache: "no-store" });
    if (r.ok) { manifest = await r.json(); render(); }
  } catch (e) { /* 服务器未起/写入中,下轮再来 */ }
}

function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function render() {
  const pages = manifest && manifest.pages || [];
  if (!pages.length) { STAGE.innerHTML = '<div class="pending">等待课件…</div>'; hud(0, 0, null, 0); return; }
  idx = Math.max(0, Math.min(idx, pages.length - 1));
  const p = pages[idx];
  hud(idx + 1, pages.length, p, pages.filter(q => q.state !== "clip").length);
  NOTES.textContent = p.notes || "";

  const key = p.id + ":" + p.state;
  if (key !== shownKey) {           // 换页或当前页资产升级 → 重绘(不动语音)
    shownKey = key;
    if (p.state === "clip")      STAGE.innerHTML = `<video src="pages/${p.id}/clip.mp4" autoplay muted playsinline></video>`;
    else if (p.state === "frame") STAGE.innerHTML = `<img src="pages/${p.id}/frame.png" alt="">`;
    else if (p.state === "text")  STAGE.innerHTML = `<div class="text"><h1>${esc(p.title)}</h1><p>${esc(p.text)}</p></div>`;
    else                          STAGE.innerHTML = `<div class="pending">第 ${idx + 1} 页制作中…</div>`;
  }
  // 语音:翻到该页时若已有音频则自动讲;页停留期间音频到达则开播
  if (p.audio && audioPage !== p.id) startAudio(p);
  if (!p.audio && audioPage === p.id && audio && audio.paused && audio.readyState >= 2) audio.play().catch(() => {});
}

function hud(pos, total, p, queue) {
  POS.textContent = `${pos}/${total}`;
  STATE.textContent = p ? STATE_LABEL[p.state] || "" : "";
  STATE.className = p ? "st-" + p.state : "";
  QUEUE.textContent = queue > 0 ? `后台制作中 ${queue} 页` : "";
}

function startAudio(p) {
  stopAudio();
  audio = new Audio(`pages/${p.id}/audio.mp3`);
  audioPage = p.id;
  audio.play().catch(() => {});    // 浏览器自动播放限制时静默,教师可按空格手动播
}
function stopAudio() { if (audio) { audio.pause(); audio = null; } audioPage = null; }

function go(d) {
  const n = (manifest && manifest.pages.length) || 0;
  const next = idx + d;
  if (next < 0 || next >= n) return;
  idx = next; shownKey = ""; stopAudio(); render();
}

addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) go(1);
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) go(-1);
  else if (e.key === " ") {
    e.preventDefault();
    if (audio && !audio.paused) audio.pause();
    else if (audio) audio.play().catch(() => {});
    else { const p = manifest && manifest.pages[idx]; if (p && p.audio) startAudio(p); }
  }
  else if (e.key === "n" || e.key === "N") NOTES.hidden = !NOTES.hidden;
});

poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
